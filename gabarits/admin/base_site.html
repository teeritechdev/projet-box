<script>
document.addEventListener('DOMContentLoaded', function() {
    function setupPillAutoSearch() {
        const actionButtons = document.querySelectorAll('.actions button[name="index"], .actions button.button, .actions button');
        actionButtons.forEach(function(btn) {
            const txt = btn.textContent.trim().toLowerCase();
            if (txt === 'cours' || txt === 'go') {
                btn.textContent = 'Exécuter l\'action';
            }
        });

        const searchInputs = document.querySelectorAll('input[name="q"], input[type="search"], .search-pill-input, .auto-search-field');

        searchInputs.forEach(function(input) {
            if (!input.dataset.pillProcessed) {
                input.dataset.pillProcessed = "true";

                if (!input.parentElement.classList.contains('search-pill-wrapper')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'search-pill-wrapper';

                    const icon = document.createElement('i');
                    icon.className = 'fa-solid fa-magnifying-glass search-red-icon';

                    input.parentNode.insertBefore(wrapper, input);
                    wrapper.appendChild(icon);
                    wrapper.appendChild(input);
                }

                if (!input.placeholder || input.placeholder === "") {
                    input.placeholder = "Recherche...";
                }
            }

            if (input.value && input.value.trim() !== '') {
                setTimeout(function() {
                    input.focus();
                    const len = input.value.length;
                    if (input.setSelectionRange) {
                        input.setSelectionRange(len, len);
                    }
                }, 100);
            }

            input.addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase().trim();

                const items = document.querySelectorAll('#result_list tbody tr, table tbody tr, .searchable-item, .searchable-card');
                if (items.length > 0) {
                    items.forEach(function(item) {
                        const text = item.textContent.toLowerCase();
                        if (!query || text.includes(query)) {
                            item.style.display = '';
                        } else {
                            item.style.display = 'none';
                        }
                    });
                }
            });
        });
    }

    function translateAddButtonsInNav() {
        const addLinks = document.querySelectorAll('#nav-sidebar a.addlink, #nav-sidebar .addlink, a.addlink, a.add-another, #nav-sidebar a');
        addLinks.forEach(function(el) {
            const txt = el.textContent.trim();
            if (txt === 'Add' || txt === '+ Add' || txt.toLowerCase() === 'add') {
                el.innerHTML = '<i class="fa-solid fa-plus" style="font-size: 10px; margin-right: 3px;"></i>Ajouter';
                el.style.color = '#059669';
                el.style.fontWeight = '800';
            } else if (el.innerHTML.includes('+ Add')) {
                el.innerHTML = el.innerHTML.replace(/\+\s*Add/g, '+ Ajouter');
            } else if (/\bAdd\b/.test(el.textContent) && !el.textContent.includes('Address') && !el.textContent.includes('Ajouter')) {
                el.innerHTML = el.innerHTML.replace(/\bAdd\b/g, 'Ajouter');
            }
        });
    }

    function customizeSubmitButtons() {
        const saveBtn = document.querySelector('.submit-row input[name="_save"]');
        const continueBtn = document.querySelector('.submit-row input[name="_continue"]');

        if (saveBtn) {
            saveBtn.value = "ENREGISTRER ET FERMER (QUITTER)";
        }
        if (continueBtn) {
            continueBtn.value = "Enregistrer et continuer l'édition";
        }
    }

    function setupDateNaissanceAutoAge() {
        const dobInput = document.querySelector('input[name="date_naissance"]');

        if (dobInput) {
            dobInput.placeholder = "JJ-MM-AAAA (ex: 15-08-1998)";

            function updateAge() {
                const ageInput = document.querySelector('.field-age .readonly, input[name="age"], #id_age');
                if (dobInput.value) {
                    const birth = new Date(dobInput.value);
                    const today = new Date();
                    let age = today.getFullYear() - birth.getFullYear();
                    const m = today.getMonth() - birth.getMonth();
                    if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) {
                        age--;
                    }
                    if (age >= 0 && ageInput) {
                        if (ageInput.tagName === 'INPUT') {
                            ageInput.value = age;
                        } else {
                            ageInput.textContent = age + ' ans';
                        }
                    }
                } else if (ageInput) {
                    if (ageInput.tagName === 'INPUT') {
                        ageInput.value = '';
                    } else {
                        ageInput.textContent = '-';
                    }
                }
            }

            ['change', 'input', 'keyup', 'blur'].forEach(function(evt) {
                dobInput.addEventListener(evt, updateAge);
            });
            updateAge();
        }
    }



    function forceRemoveRelatedActionIcons() {
        const actionLinks = document.querySelectorAll(
            '.related-widget-wrapper-link, a.add-related, a.change-related, a.delete-related, a.view-related, .change-related, .add-related, .delete-related, .view-related, .field-pays_fk a, .field-categorie a, .field-arbitre_central a'
        );
        actionLinks.forEach(function(link) {
            link.style.display = 'none';
            link.remove();
        });
    }

    setupPillAutoSearch();
    translateAddButtonsInNav();
    customizeSubmitButtons();
    setupDateNaissanceAutoAge();
    forceRemoveRelatedActionIcons();

    [100, 300, 500, 1000].forEach(function(delay) {
        setTimeout(function() {
            translateAddButtonsInNav();
            customizeSubmitButtons();
            setupDateNaissanceAutoAge();
            forceRemoveRelatedActionIcons();
        }, delay);
    });
});

</script>
{% endblock %}
