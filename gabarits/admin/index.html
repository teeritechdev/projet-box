{% extends "admin/base_site.html" %}
{% load i18n static %}

{% block extrastyle %}{{ block.super }}
<style>
    /* Nouveau design moderne pour l'Administration de Boxe / MMA */
    .admin-container {
        display: flex;
        flex-direction: column;
        gap: 24px;
        margin-top: 10px;
    }

    /* Quick Links Bar */
    .admin-quick-bar {
        background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
        border-radius: 20px;
        padding: 20px 24px;
        color: #FFFFFF;
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border: 1px solid #334155;
    }

    .admin-quick-title h2 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #FFFFFF !important;
    }

    .admin-quick-title p {
        margin: 4px 0 0 0;
        font-size: 12px;
        color: #94A3B8;
        font-weight: 600;
    }

    .admin-quick-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .quick-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #FFFFFF !important;
        padding: 10px 16px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none !important;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease-in-out;
    }

    .quick-btn:hover {
        background: #DC2626;
        border-color: #EF4444;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
    }

    .quick-btn-gold {
        background: linear-gradient(135deg, #D97706, #B45309);
        border: none;
    }

    .quick-btn-gold:hover {
        background: linear-gradient(135deg, #F59E0B, #D97706);
    }

    /* App Cards Grid */
    .apps-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 24px;
    }

    @media (max-width: 1024px) {
        .apps-layout {
            grid-template-columns: 1fr;
        }
    }

    .app-cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 20px;
    }

    .app-card {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(15, 23, 42, 0.04);
        transition: all 0.25s ease-in-out;
    }

    .app-card:hover {
        border-color: #CBD5E1;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        transform: translateY(-2px);
    }

    .app-card-header {
        background: #0F172A;
        color: #FFFFFF;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 3px solid #DC2626;
    }

    .app-card-title {
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #FFFFFF;
    }

    .model-row {
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #F1F5F9;
        transition: background 0.15s;
    }

    .model-row:last-child {
        border-bottom: none;
    }

    .model-row:hover {
        background: #F8FAFC;
    }

    .model-link {
        font-weight: 700;
        font-size: 14px;
        color: #1E293B !important;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none !important;
    }

    .model-link:hover {
        color: #2563EB !important;
    }

    .model-actions {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .btn-action-add {
        background: #EFF6FF;
        color: #2563EB !important;
        border: 1px solid #BFDBFE;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 800;
        text-decoration: none !important;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: all 0.2s;
        text-transform: uppercase;
    }

    .btn-action-add:hover {
        background: #2563EB;
        color: #FFFFFF !important;
        border-color: #2563EB;
    }

    .btn-action-change {
        background: #F8FAFC;
        color: #64748B !important;
        border: 1px solid #E2E8F0;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        text-decoration: none !important;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: all 0.2s;
        text-transform: uppercase;
    }

    .btn-action-change:hover {
        background: #0F172A;
        color: #FFFFFF !important;
        border-color: #0F172A;
    }

    /* Sidebar Actions Récentes */
    .recent-actions-card {
        background: #FFFFFF;
        border: 1px solid #E2E8F0;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(15, 23, 42, 0.04);
    }

    .recent-actions-header {
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #0F172A;
        padding-bottom: 12px;
        border-bottom: 2px solid #E2E8F0;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .action-item {
        padding: 10px 0;
        border-bottom: 1px solid #F1F5F9;
        font-size: 12px;
    }

    .action-item:last-child {
        border-bottom: none;
    }

    .action-link {
        font-weight: 700;
        color: #0F172A !important;
        text-decoration: none !important;
    }

    .action-link:hover {
        color: #2563EB !important;
    }

    .action-type {
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 4px;
        margin-right: 6px;
    }

    .action-add { background: #DCFCE7; color: #166534; }
    .action-change { background: #FEF3C7; color: #92400E; }
    .action-delete { background: #FEE2E2; color: #991B1B; }
</style>
{% endblock %}

{% block content %}
<div class="admin-container" style="min-h: 60vh;">
    <!-- Espace d'administration propre centré sur le menu de gauche -->
</div>
{% endblock %}
