<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fédération de Boxe - Scoring & Broadcast{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; 
            background: #F1F5F9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(225, 29, 72, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: #0F172A; 
        }
        .font-teko { font-family: 'Teko', sans-serif; letter-spacing: 0.03em; }
        .bg-glass { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(203, 213, 225, 0.8); 
            box-shadow: 0 10px 30px -10px rgba(15, 23, 42, 0.08);
        }
        .bg-glass-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bg-glass-card:hover {
            border-color: #94A3B8;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.12);
        }
        .glow-red { box-shadow: 0 4px 20px rgba(225, 29, 72, 0.2); }
        .glow-blue { box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2); }
        .glow-gold { box-shadow: 0 4px 20px rgba(245, 158, 11, 0.25); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #F1F5F9; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white">
    {% block body %}{% endblock %}
</body>
</html>
